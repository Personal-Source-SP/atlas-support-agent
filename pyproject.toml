[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, variables, syntax)
    "I",    # isort (import ordering)
    "B",    # flake8-bugbear (common bugs & design flaws, bare exceptions)
    "UP",   # pyupgrade (modern Python syntax standards)
    "RUF",  # ruff-specific rules
]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]


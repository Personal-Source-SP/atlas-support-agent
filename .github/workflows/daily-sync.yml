name: Daily Knowledge Base Sync

on:
  schedule:
    - cron: '0 0 * * *'  # Chạy tự động lúc 00:00 UTC mỗi ngày
  workflow_dispatch:      # Kích hoạt thủ công từ GitHub UI

jobs:
  sync:
    name: Execute Daily Ingestion & Delta Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lint and Format Check with Ruff
        run: |
          pip install ruff
          ruff check .
          ruff format --check .

      - name: Restore Sync State Cache
        uses: actions/cache@v4
        with:
          path: sync_state.db
          key: sync-db-${{ github.run_id }}
          restore-keys: |
            sync-db-

      - name: Build Docker Container
        run: docker build -t optibot-sync:latest .

      - name: Prepare Report Directory
        run: mkdir -p reports

      - name: Run Daily Sync Container (Delta Scraper & Embedding)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/reports:/app/reports \
            -v ${{ github.workspace }}/sync_state.db:/app/sync_state.db \
            -e GEMINI_API_KEY=$GEMINI_API_KEY \
            optibot-sync:latest

      - name: Render GitHub Actions Step Summary Report
        if: always()
        run: |
          if [ -f reports/daily_sync_report.md ]; then
            cat reports/daily_sync_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Daily Sync Execution Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-sync-report-${{ github.run_number }}
          path: |
            reports/daily_sync_report.json
            reports/daily_sync_report.md
            sync_state.db
          retention-days: 30
